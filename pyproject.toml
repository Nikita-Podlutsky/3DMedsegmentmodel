[project]
name = "3d-medsegment-model"
version = "0.1.0"
description = "Coarse-to-Fine 3D Medical Image Segmentation Module"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchio>=0.18.90",
    "h5py>=3.8.0",
    "numpy>=1.24.0",
    "nibabel>=5.1.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "scikit-image>=0.20.0",
    "hydra-core>=1.3.3",
    "pandas>=2.3.3",
]

[tool.uv]
dev-dependencies = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
